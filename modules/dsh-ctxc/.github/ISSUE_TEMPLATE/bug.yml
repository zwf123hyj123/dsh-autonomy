name: 问题反馈
description: 报故障、异常、报错
labels: [bug]
body:
  - type: input
    id: ver
    attributes:
      label: 插件版本
      placeholder: 如 0.2.0
    validations: { required: true }
  - type: input
    id: app
    attributes:
      label: dsh-go 版本与运行环境
      placeholder: 如 手机 proot Ubuntu 24.04 / App 1.0.x
  - type: textarea
    id: desc
    attributes:
      label: 现象
      description: 发生了什么、期望是什么
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. … 2. …
  - type: textarea
    id: log
    attributes:
      label: 相关日志/截图（可选）
