name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 语法与清单检查
        run: |
          node --check lib/index.js
          node .github/scripts/validate.mjs
      - name: 打包 npm 产物
        run: npm pack
      - name: 创建 GitHub Release 并附包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dsh-ctxc-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
